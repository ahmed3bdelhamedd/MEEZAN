<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المؤشرات التنفيذية - الموازنة العامة المصرية</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F2C59;
            --secondary: #173B6B;
            --accent: #2E7D32;
            --danger: #C62828;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 30px;
            color: var(--text-main);
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 35px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(15, 44, 89, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
        }
        .header p {
            margin: 8px 0 0 0;
            color: #E2E8F0;
            font-size: 15px;
        }
        .filter-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
        }
        .filter-box label {
            font-weight: 600;
            font-size: 14px;
        }
        .filter-box select {
            background: white;
            color: var(--text-main);
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border-right: 6px solid var(--primary);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }
        .kpi-card h3 {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }
        .kpi-card .value {
            font-size: 26px;
            font-weight: 900;
            margin: 12px 0 0 0;
            color: var(--primary);
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }
        @media(max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
        .chart-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .chart-card h2 {
            font-size: 16px;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
            border-bottom: 2px solid #F1F5F9;
            padding-bottom: 12px;
        }
        .chart-container {
            position: relative;
            height: 350px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="header">
            <div>
                <h1>📊 لوحة المؤشرات التنفيذية للموازنة العامة</h1>
                <p>تحليل مالي تفصيلي لبنود المصروفات، فوائد الديون، والأجور</p>
            </div>
            <div class="filter-box">
                <label for="yearSelect">السنة المالية:</label>
                <select id="yearSelect" onchange="updateDashboard()">
                    <option value="2025/2026">موازنة 2025/2026 (البيان التفصيلي)</option>
                    <option value="2026/2027">موازنة 2026/2027 (التوقعات الإجمالية)</option>
                </select>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card" style="border-right-color: #C62828;">
                <h3>إجمالي المصروفات الكلي</h3>
                <p class="value" id="kpiExp">-</p>
            </div>
            <div class="kpi-card" style="border-right-color: #D84315;">
                <h3>فوائد الديون</h3>
                <p class="value" id="kpiDebt">-</p>
            </div>
            <div class="kpi-card" style="border-right-color: #2E7D32;">
                <h3>الدعم والمزايا الاجتماعية</h3>
                <p class="value" id="kpiSub">-</p>
            </div>
            <div class="kpi-card" style="border-right-color: #1565C0;">
                <h3>أجور وتعويضات العاملين</h3>
                <p class="value" id="kpiWages">-</p>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>تحليل بنود المصروفات الرئيسية (مليار جنيه)</h2>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h2>هيكل وتوزيع بنود الإنفاق (%)</h2>
                <div class="chart-container">
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        const budgetData = {
            "2025/2026": {
                "Total Expenditures": "4,573.0",
                "Debt Service": "2,298.0",
                "Subsidies": "742.6",
                "Wages": "679.0",
                "Investments": "434.9"
            },
            "2026/2027": {
                "Total Expenditures": "5,100.0",
                "Debt Service": "2,100.0",
                "Subsidies": "836.8",
                "Wages": "822.8",
                "Investments": "553.7"
            }
        };

        let barChartInstance = null;
        let doughnutChartInstance = null;

        function updateDashboard() {
            const selectedYear = document.getElementById('yearSelect').value;
            const yData = budgetData[selectedYear];

            document.getElementById('kpiExp').innerText = yData['Total Expenditures'] + ' مليار';
            document.getElementById('kpiDebt').innerText = yData['Debt Service'] + ' مليار';
            document.getElementById('kpiSub').innerText = yData['Subsidies'] + ' مليار';
            document.getElementById('kpiWages').innerText = yData['Wages'] + ' مليار';

            const rawData = [
                parseFloat(yData['Debt Service'].replace(',', '')),
                parseFloat(yData['Subsidies'].replace(',', '')),
                parseFloat(yData['Wages'].replace(',', '')),
                parseFloat(yData['Investments'].replace(',', ''))
            ];

            if (barChartInstance) barChartInstance.destroy();
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['فوائد الديون', 'الدعم والمنح', 'الأجور', 'الاستثمارات'],
                    datasets: [{
                        label: 'القيمة (مليار جنيه)',
                        data: rawData,
                        backgroundColor: ['#D84315', '#2E7D32', '#1565C0', '#FF8F00'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#F1F5F9' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            const pieCtx = document.getElementById('doughnutChart').getContext('2d');
            doughnutChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['فوائد الديون', 'الدعم', 'الأجور', 'الاستثمارات'],
                    datasets: [{
                        data: rawData,
                        backgroundColor: ['#D84315', '#2E7D32', '#1565C0', '#FF8F00'],
                        borderWidth: 2,
                        borderColor: '#FFFFFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Cairo', size: 12 } } }
                    }
                }
            });
        }

        window.onload = updateDashboard;
    </script>
</body>
</html>
