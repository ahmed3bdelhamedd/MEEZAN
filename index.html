<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المؤشرات التحليلية - موازنة مصر العامة</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; background: #1B365D; color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .filter-section { background: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .filter-section label { font-weight: bold; color: #1B365D; font-size: 16px; }
        .filter-section select { padding: 8px 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; font-family: inherit; outline: none; background: #fff; cursor: pointer; }
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-top: 5px solid #1B365D; }
        .kpi-card h3 { margin: 0; font-size: 14px; color: #666; }
        .kpi-card p { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; color: #1B365D; }
        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .chart-card h2 { font-size: 16px; color: #1B365D; margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 لوحة المؤشرات التحليلية التفاعلية للموازنة العامة لمصر</h1>
        <p>تحليل تفصيلي للمصروفات، فوائد الديون، الأجور، والدعم (موازنة 2025/2026)</p>
    </div>

    <div class="filter-section">
        <label for="yearSelect">📅 اختر الموازنة / السنة المالية:</label>
        <select id="yearSelect" onchange="updateDashboard()">
            <option value="2025/2026">موازنة 2025/2026 (البيان التفصيلي للمصروفات)</option>
            <option value="2026/2027">موازنة 2026/2027 (توقعات إجمالية)</option>
        </select>
    </div>

    <div class="kpi-container">
        <div class="kpi-card" style="border-top-color: #C62828;">
            <h3>إجمالي المصروفات</h3>
            <p id="kpiExp">-</p>
        </div>
        <div class="kpi-card" style="border-top-color: #D84315;">
            <h3>فوائد الديون</h3>
            <p id="kpiDebt">-</p>
        </div>
        <div class="kpi-card" style="border-top-color: #2E7D32;">
            <h3>الدعم والمزايا الاجتماعية</h3>
            <p id="kpiSub">-</p>
        </div>
        <div class="kpi-card" style="border-top-color: #1565C0;">
            <h3>أجور وتعويضات العاملين</h3>
            <p id="kpiWages">-</p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h2>تحليل بنود المصروفات الرئيسية (مليار جنيه)</h2>
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>هيكل وتوزيع المصروفات (%)</h2>
            <canvas id="doughnutChart"></canvas>
        </div>
    </div>

    <script>
        const budgetData = {
            "2025/2026": {
                "Total Expenditures": 4573.0,
                "Debt Service": 2298.0,
                "Subsidies": 742.6,
                "Wages": 679.0,
                "Investments": 434.9
            },
            "2026/2027": {
                "Total Expenditures": 5100.0,
                "Debt Service": 2100.0,
                "Subsidies": 836.8,
                "Wages": 822.8,
                "Investments": 553.7
            }
        };

        let barChartInstance = null;
        let doughnutChartInstance = null;

        function updateDashboard() {
            const selectedYear = document.getElementById('yearSelect').value;
            const yData = budgetData[selectedYear];

            document.getElementById('kpiExp').innerText = yData['Total Expenditures'] + ' مليار جـ';
            document.getElementById('kpiDebt').innerText = yData['Debt Service'] + ' مليار جـ';
            document.getElementById('kpiSub').innerText = yData['Subsidies'] + ' مليار جـ';
            document.getElementById('kpiWages').innerText = yData['Wages'] + ' مليار جـ';

            if (barChartInstance) barChartInstance.destroy();
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['فوائد الديون', 'الدعم والمزايا الاجتماعية', 'الأجور وتعويضات العاملين', 'الاستثمارات (أصول غير مالية)'],
                    datasets: [{
                        label: 'القيمة (مليار جنيه)',
                        data: [yData['Debt Service'], yData['Subsidies'], yData['Wages'], yData['Investments']],
                        backgroundColor: ['#D84315', '#2E7D32', '#1565C0', '#FF8F00']
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            if (doughnutChartInstance) doughnutChartInstance.destroy();
            const pieCtx = document.getElementById('doughnutChart').getContext('2d');
            doughnutChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['فوائد الديون', 'الدعم', 'الأجور', 'الاستثمارات'],
                    datasets: [{
                        data: [yData['Debt Service'], yData['Subsidies'], yData['Wages'], yData['Investments']],
                        backgroundColor: ['#D84315', '#2E7D32', '#1565C0', '#FF8F00']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        window.onload = updateDashboard;
    </script>
</body>
</html>
