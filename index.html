<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ميزان - MEEZAN | الرئيسية</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ahmed3bdelhamedd/MEEZAN/main/download.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F2C59;
            --secondary: #173B6B;
            --accent: #10b981;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* تصميم الهيدر الاحترافي مع القائمة المنسدلة والتجاوب */
        .landing-nav {
            max-width: 1200px;
            margin: 25px auto 0 auto;
            padding: 15px 35px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(15, 44, 89, 0.05);
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 1000;
        }
        .logo { font-weight: 900; color: var(--primary); font-size: 1.4rem; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .nav-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        
        /* تصميم زر القائمة المنسدلة (Dropdown) */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background: #f8fafc;
            color: var(--primary);
            border: 2px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .dropbtn:hover {
            border-color: var(--accent);
            background: #f1f5f9;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 120%;
            right: 0;
            background-color: #ffffff;
            min-width: 230px;
            box-shadow: 0 15px 35px rgba(15, 44, 89, 0.1);
            border-radius: 16px;
            padding: 10px;
            z-index: 1000;
            border: 1px solid #e2e8f0;
            animation: dropdownFade 0.3s ease-out forwards;
        }
        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dropdown-content a {
            color: var(--text-main);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .dropdown-content a:hover {
            background-color: #f1f5f9;
            color: var(--accent);
            transform: translateX(-4px);
        }
        html[lang="en"] .dropdown-content a:hover {
            transform: translateX(4px);
        }
        .dropdown.active .dropdown-content {
            display: block;
        }

        .btn-login {
            background: var(--primary); 
            border: 2px solid var(--primary); 
            color: white;
            padding: 10px 22px; 
            border-radius: 12px; 
            font-weight: bold; 
            text-decoration: none; 
            transition: all 0.3s;
            font-size: 0.92rem;
            white-space: nowrap;
        }
        .btn-login:hover { 
            background: var(--secondary); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 44, 89, 0.25);
        }
        
        .lang-btn {
            background: #f8fafc; border: 2px solid #e2e8f0; padding: 10px 16px;
            border-radius: 12px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; color: var(--primary);
            transition: all 0.3s; font-size: 0.92rem;
        }
        .lang-btn:hover { background: #f1f5f9; border-color: var(--accent); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animated { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .hero {
            max-width: 1200px;
            margin: 40px auto;
            padding: 80px 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(15, 44, 89, 0.18);
            position: relative;
            overflow: hidden;
        }
        .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 20px; }
        .hero p { font-size: 1.25rem; color: #E2E8F0; max-width: 850px; margin: 0 auto 35px auto; line-height: 1.8; }
        .hero-btns { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
        .btn-main {
            background: var(--accent); color: white; padding: 15px 32px; border-radius: 14px;
            font-weight: bold; text-decoration: none; transition: all 0.3s; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }
        .btn-main:hover { background: #059669; transform: translateY(-3px); }

        .features {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .feature-card {
            background: var(--card-bg); padding: 35px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }
        .feature-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.06); }
        .feature-card h3 { color: var(--primary); margin-bottom: 14px; font-size: 1.35rem; font-weight: 900; }
        .feature-card p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; }

        .team-section {
            max-width: 1200px;
            margin: 90px auto;
            padding: 0 20px;
            text-align: center;
        }
        .team-section h2 { font-size: 2.3rem; color: var(--primary); margin-bottom: 12px; font-weight: 900; }
        .team-section .subtitle { color: var(--text-muted); margin-bottom: 45px; font-size: 1.15px; }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 35px;
            justify-content: center;
        }
        .team-card {
            background: var(--card-bg); padding: 35px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
            transition: all 0.3s ease; text-align: center;
        }
        .team-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
        .team-avatar {
            width: 120px; height: 120px; border-radius: 50%; object-fit: cover;
            margin: 0 auto 20px auto; border: 4px solid var(--accent);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
        }
        .team-card h3 { color: var(--primary); font-size: 1.3rem; font-weight: 900; margin-bottom: 6px; }
        .team-card p.role { color: var(--accent); font-weight: bold; font-size: 0.95rem; margin-bottom: 14px; }
        .team-card p.desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

        footer {
            text-align: center; padding: 40px; color: var(--text-muted);
            border-top: 1px solid #e2e8f0; margin-top: 90px; font-size: 1rem;
        }

        /* ==========================================================
            📱 التجاوب الكامل للشاشات المختلفة (Media Queries)
            ========================================================== */

        /* الأجهزة اللوحية والتابلت (Tablets - iPad) */
        @media (max-width: 1024px) {
            .landing-nav {
                margin: 20px 15px 0 15px;
                padding: 12px 25px;
            }
            .hero {
                margin: 30px 15px;
                padding: 60px 25px;
            }
            .hero h1 { font-size: 2.4rem; }
            .features, .team-section {
                padding: 0 15px;
            }
        }

        /* الهواتف الذكية والموبايل (Mobile Phones) */
        @media (max-width: 768px) {
            .landing-nav {
                margin: 12px
