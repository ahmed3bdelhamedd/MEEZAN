<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ميزان - بوابة البلاغات والمشروعات</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ahmed3bdelhamedd/MEEZAN/main/download.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="header.js"></script>
    <style>
        :root {
            --primary-color: #10b981;
            --primary-dark: #059669;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0 25px 25px 25px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animated { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .card {
            background: var(--card-bg); border-radius: 18px; padding: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03); margin-bottom: 30px; border: 1px solid #f1f5f9;
        }
        .card h2 { margin-bottom: 20px; font-size: 1.4rem; color: #0F2C59; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; font-weight: 900; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        select, input, textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 12px; font-size: 1rem; background: #fff; font-family: 'Cairo', sans-serif; outline: none; transition: border-color 0.3s;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        textarea { resize: vertical; height: 120px; }
        button {
            background-color: var(--primary-color); color: white; border: none; padding: 14px 24px;
            font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: all 0.3s; width: 100%; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        button:hover { background-color: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .info-box { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .info-box h3 { color: var(--primary-dark); margin-bottom: 5px; font-size: 1.1rem; }
        .info-box p { font-size: 1.3rem; font-weight: bold; color: #0F2C59; }
        #aiResult { margin-top: 20px; padding: 20px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px; display: none; }
    </style>
</head>
<body>

    <div class="container animated">
        <div class="card">
            <h2 data-translate="meezan_card1_title">متابعة الموازنة والمشروعات حسب المحافظة</h2>
            <div class="form-group">
                <label for="governorate" data-translate="meezan_gov_label">اختر المحافظة:</label>
                <select id="governorate" onchange="updateData()">
                    <option value="" data-translate="gov_default">-- اختر المحافظة --</option>
                    <option value="cairo">القاهرة</option>
                    <option value="giza">الجيزة</option>
                    <option value="alex">الإسكندرية</option>
                    <option value="dakahlia">الدقهلية</option>
                    <option value="sharqia">الشرقية</option>
                    <option value="beheira">البحيرة</option>
                    <option value="gharbiya">الغربية</option>
                    <option value="qalyubia">القليوبية</option>
                    <option value="minya">المنيا</option>
                    <option value="sohag">سوهاج</option>
                    <option value="assiut">أسيوط</option>
                    <option value="monufia">المنوفية</option>
                    <option value="fayoum">الفيوم</option>
                    <option value="qena">قنا</option>
                    <option value="kafr_elsheikh">كفر الشيخ</option>
                    <option value="beni_suef">بني سويف</option>
                    <option value="aswan">أسوان</option>
                    <option value="damietta">دمياط</option>
                    <option value="ismailia">الإسماعيلية</option>
                    <option value="luxor">الأقصر</option>
                    <option value="suez">السويس</option>
                    <option value="portsaid">بورسعيد</option>
                    <option value="matrouh">مطروح</option>
                    <option value="north_sinai">شمال سيناء</option>
                    <option value="red_sea">البحر الأحمر</option>
                    <option value="new_valley">الوادي الجديد</option>
                    <option value="south_sinai">جنوب سيناء</option>
                </select>
            </div>

            <div class="info-grid" id="statsContainer" style="display: none;">
                <div class="info-box">
                    <h3 data-translate="meezan_edu">ميزانية التعليم المخصصة</h3>
                    <p id="eduBudget">--</p>
                </div>
                <div class="info-box">
                    <h3 data-translate="meezan_health">ميزانية الصحة</h3>
                    <p id="healthBudget">--</p>
                </div>
                <div class="info-box">
                    <h3 data-translate="meezan_roads">نسبة تنفيذ مشروعات الطرق</h3>
                    <p id="roadsProgress">--</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 data-translate="meezan_card2_title">نظام البلاغات والشكاوى المدعوم بالذكاء الاصطناعي</h2>
            <form id="reportForm" onsubmit="submitReport(event)">
                <div class="form-group">
                    <label for="reportArea" data-translate="meezan_area_label">المنطقة أو الحي بالتحديد:</label>
                    <input type="text" id="reportArea" placeholder="مثال: الحي الأول، مركز المدينة..." required>
                </div>
                <div class="form-group">
                    <label for="reportDesc" data-translate="meezan_desc_label">وصف المشكلة (طريق مكسور، كسر مياه، إنارة...):</label>
                    <textarea id="reportDesc" placeholder="اكتب تفاصيل المشكلة هنا ليقوم الـ AI بتحليلها..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="reportImage" data-translate="meezan_img_label">إرفاق صورة للمشكلة:</label>
                    <input type="file" id="reportImage" accept="image/*">
                </div>
                <button type="submit" data-translate="meezan_submit_btn">إرسال البلاغ للتحليل والمعالجة</button>
            </form>

            <div id="aiResult">
                <h3 style="color: #065f46; margin-bottom: 8px;" data-translate="meezan_ai_title">تحليل النظام الذكي (AI Analysis):</h3>
                <p id="aiOutputText" style="color: #047857;"></p>
            </div>
        </div>
    </div>

    <script>
        if (typeof sharedDictionary !== 'undefined') {
            Object.assign(sharedDictionary.ar, {
                meezan_card1_title: "متابعة الموازنة والمشروعات حسب المحافظة",
                meezan_gov_label: "اختر المحافظة:",
                gov_default: "-- اختر المحافظة --",
                meezan_edu: "ميزانية التعليم المخصصة",
                meezan_health: "ميزانية الصحة",
                meezan_roads: "نسبة تنفيذ مشروعات الطرق",
                meezan_card2_title: "نظام البلاغات والشكاوى المدعوم بالذكاء الاصطناعي",
                meezan_area_label: "المنطقة أو الحي بالتحديد:",
                meezan_desc_label: "وصف المشكلة (طريق مكسور، كسر مياه، إنارة...):",
                meezan_img_label: "إرفاق صورة للمشكلة:",
                meezan_submit_btn: "إرسال البلاغ للتحليل والمعالجة",
                meezan_ai_title: "تحليل النظام الذكي (AI Analysis):"
            });

            Object.assign(sharedDictionary.en, {
                meezan_card1_title: "Budget & Projects Tracking by Governorate",
                meezan_gov_label: "Select Governorate:",
                gov_default: "-- Select Governorate --",
                meezan_edu: "Allocated Education Budget",
                meezan_health: "Health Budget",
                meezan_roads: "Road Projects Progress Rate",
                meezan_card2_title: "AI-Powered Reporting & Complaints System",
                meezan_area_label: "Specific Area or District:",
                meezan_desc_label: "Problem Description (Broken road, water leak, lighting...):",
                meezan_img_label: "Attach Problem Image:",
                meezan_submit_btn: "Submit Report for Analysis & Processing",
                meezan_ai_title: "Smart System Analysis (AI Analysis):"
            });
        }

        const governoratesData = {
            "cairo": { edu: "720 مليون جنيه", health: "580 مليون جنيه", roads: "85%" },
            "giza": { edu: "650 مليون جنيه", health: "490 مليون جنيه", roads: "80%" },
            "alex": { edu: "480 مليون جنيه", health: "370 مليون جنيه", roads: "82%" },
            "dakahlia": { edu: "420 مليون جنيه", health: "310 مليون جنيه", roads: "76%" },
            "sharqia": { edu: "450 مليون جنيه", health: "330 مليون جنيه", roads: "75%" },
            "beheira": { edu: "390 مليون جنيه", health: "290 مليون جنيه", roads: "73%" },
            "gharbiya": { edu: "360 مليون جنيه", health: "270 مليون جنيه", roads: "79%" },
            "qalyubia": { edu: "410 مليون جنيه", health: "300 مليون جنيه", roads: "78%" },
            "minya": { edu: "380 مليون جنيه", health: "280 مليون جنيه", roads: "70%" },
            "sohag": { edu: "370 مليون جنيه", health: "260 مليون جنيه", roads: "72%" },
            "assiut": { edu: "350 مليون جنيه", health: "250 مليون جنيه", roads: "71%" },
            "monufia": { edu: "340 مليون جنيه", health: "260 مليون جنيه", roads: "77%" },
            "fayoum": { edu: "310 مليون جنيه", health: "230 مليون جنيه", roads: "68%" },
            "qena": { edu: "320 مليون جنيه", health: "240 مليون جنيه", roads: "69%" },
            "kafr_elsheikh": { edu: "300 مليون جنيه", health: "220 مليون جنيه", roads: "74%" },
            "beni_suef": { edu: "290 مليون جنيه", health: "210 مليون جنيه", roads: "72%" },
            "aswan": { edu: "250 مليون جنيه", health: "190 مليون جنيه", roads: "81%" },
            "damietta": { edu: "240 مليون جنيه", health: "180 مليون جنيه", roads: "83%" },
            "ismailia": { edu: "260 مليون جنيه", health: "200 مليون جنيه", roads: "84%" },
            "luxor": { edu: "210 مليون جنيه", health: "160 مليون جنيه", roads: "86%" },
            "suez": { edu: "220 مليون جنيه", health: "170 مليون جنيه", roads: "88%" },
            "portsaid": { edu: "230 مليون جنيه", health: "180 مليون جنيه", roads: "90%" },
            "matrouh": { edu: "190 مليون جنيه", health: "140 مليون جنيه", roads: "65%" },
            "north_sinai": { edu: "180 مليون جنيه", health: "130 مليون جنيه", roads: "62%" },
            "red_sea": { edu: "200 مليون جنيه", health: "150 مليون جنيه", roads: "87%" },
            "new_valley": { edu: "160 مليون جنيه", health: "120 مليون جنيه", roads: "60%" },
            "south_sinai": { edu: "170 مليون جنيه", health: "130 مليون جنيه", roads: "85%" }
        };

        function updateData() {
            const gov = document.getElementById('governorate').value;
            const stats = document.getElementById('statsContainer');
            const currentLang = localStorage.getItem('meezanLang') || 'ar';
            const unitText = currentLang === 'en' ? 'Million EGP' : 'مليون جنيه';

            if (gov && governoratesData[gov]) {
                stats.style.display = 'grid';
                let data = governoratesData[gov];
                document.getElementById('eduBudget').innerText = data.edu.replace('مليون جنيه', unitText);
                document.getElementById('healthBudget').innerText = data.health.replace('مليون جنيه', unitText);
                document.getElementById('roadsProgress').innerText = data.roads;
            } else {
                stats.style.display = 'none';
            }
        }

        function submitReport(event) {
            event.preventDefault();
            const area = document.getElementById('reportArea').value;
            const desc = document.getElementById('reportDesc').value;
            const govSelect = document.getElementById('governorate');
            const gov = govSelect.options[govSelect.selectedIndex].text;
            const currentLang = localStorage.getItem('meezanLang') || 'ar';

            let category = currentLang === 'en' ? "General Services" : "خدمات عامة";
            let priority = currentLang === 'en' ? "Medium" : "متوسطة";
            const descLower = desc.toLowerCase();

            if (descLower.includes('مياه') || descLower.includes('water') || descLower.includes('pipe') || descLower.includes('صرف')) {
                category = currentLang === 'en' ? "Water & Sanitation" : "مياه وصرف صحي";
                priority = currentLang === 'en' ? "Critical / Urgent" : "حرجة / عاجلة";
            } else if (descLower.includes('طريق') || descLower.includes('road') || descLower.includes('hole') || descLower.includes('حفرة')) {
                category = currentLang === 'en' ? "Roads & Transportation" : "طرق ومواصلات";
                priority = currentLang === 'en' ? "Medium" : "متوسطة";
            } else if (descLower.includes('نور') || descLower.includes('light') || descLower.includes('electricity') || descLower.includes('إنارة')) {
                category = currentLang === 'en' ? "Electricity & Lighting" : "كهرباء وإنارة";
                priority = currentLang === 'en' ? "Low" : "منخفضة";
            }

            const newReport = {
                id: "#MS-" + Math.floor(1000 + Math.random() * 9000),
                location: area + " (" + gov + ")",
                description: desc,
                category: category,
                priority: priority,
                status: currentLang === 'en' ? "In Progress" : "قيد الإجراء"
            };

            let reports = JSON.parse(localStorage.getItem('meezanReports')) || [];
            reports.unshift(newReport);
            localStorage.setItem('meezanReports', JSON.stringify(reports));

            const resultBox = document.getElementById('aiResult');
            const outputText = document.getElementById('aiOutputText');
            resultBox.style.display = 'block';

            if (currentLang === 'en') {
                outputText.innerHTML = `Report received and successfully analyzed and saved in the system!<br>
                - AI Detected Category: <strong>${category}</strong><br>
                - Estimated Priority Level: <strong>${priority}</strong><br>
                - Data sent directly to the admin dashboard.`;
            } else {
                outputText.innerHTML = `تم استلام البلاغ وتحليله بنجاح وحفظه في النظام!<br>
                - التصنيف المكتشف بالذكاء الاصطناعي: <strong>${category}</strong><br>
                - مستوى الأولوية المقدر: <strong>${priority}</strong><br>
                - تم إرسال البيانات مباشرة إلى لوحة تحكم المسؤولين.`;
            }

            document.getElementById('reportForm').reset();
        }
    </script>
</body>
</html>
